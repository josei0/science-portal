<text x="160" y="128" font-size="26" font-weight="700">KAIN KERING</text><text x="450" y="128" font-size="26" font-weight="700">PLASTIK UTUH</text><text x="740" y="128" font-size="26" font-weight="700">BAHAN BARU</text>
