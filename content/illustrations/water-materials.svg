<rect x="668" y="188" width="144" height="121" rx="18" fill="#e9e5f7" stroke="#b4a5cd" stroke-width="3"/><text x="740" y="273" font-size="82" font-weight="700" fill="#79628f">?</text>
<text x="160" y="353" font-size="24" font-weight="700">MENYERAP</text><text x="450" y="353" font-size="24" font-weight="700">MENAHAN AIR</text><text x="740" y="353" font-size="24" font-weight="700">UJI DAHULU</text>
<text x="160" y="383" font-size="19">Air masuk ke bahan.</text><text x="450" y="383" font-size="19">Tetesan di permukaan.</text><text x="740" y="383" font-size="19">Belum ada bukti.</text>
<text x="450" y="452" font-size="21">Mengelap tumpahan dan melindungi buku memerlukan sifat berbeda.</text>
</g></svg>
