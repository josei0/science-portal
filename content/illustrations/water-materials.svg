<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">Penyerap, penahan, atau belum diuji</title><desc id="desc">Kain menyerap air ke serat. Plastik utuh menahan tetesan. Bahan C perlu diuji sebelum disimpulkan.</desc>
